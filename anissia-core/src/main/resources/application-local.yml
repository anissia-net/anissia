env: local
host: http://localhost:5173

spring.datasource:
  url: jdbc:mariadb://localhost:3306/anissia
  username: anissia
  password: anissia

elasticsearch:
  url: http://localhost:9200
  username:
  password:

spring:
  config:
    import: optional:file:../.local/anissia.properties,optional:file:./.local/anissia.properties
  jpa:
    hibernate:
      ddl-auto: update

anissia.wiki.upload:
  enabled: ${ANISSIA_WIKI_UPLOAD_ENABLED:true}
  temp-root: ./data/wiki/temp
  public-root: ./data/wiki/public
  original-root: ./data/wiki/originals
  public-base-url: http://localhost:8001/wiki/files
  retain-originals: true
  serve-files: true
