spring:
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    properties.hibernate:
      jdbc.batch_size: 4
      timezone.default_storage: NORMALIZE
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    open-in-view: false
  data.elasticsearch.repositories.enabled: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
  jooq:
    sql-dialect: mariadb

google.analytics.id: G-Z38PT7F09M

server:
  port: 8001
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 400

anissia:
  wiki:
    upload:
      enabled: ${ANISSIA_WIKI_UPLOAD_ENABLED:false}
      ffmpeg-path: ${ANISSIA_FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${ANISSIA_FFPROBE_PATH:ffprobe}
  push:
    vapid-public-key: ${ANISSIA_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${ANISSIA_PUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${ANISSIA_PUSH_VAPID_SUBJECT:}
  concurrency:
    fan-out-limit: 16
  search:
    mock: false

dat:
  uri: http://localhost:8088
  token: ""
  interval-seconds: 60
